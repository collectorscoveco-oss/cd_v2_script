name: SonarDeck Release ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - "sonardeck-v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release ZIP
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Package release ZIP
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipRoot = "SonarDeck-Studio-$tag"
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stageDir = Join-Path $env:RUNNER_TEMP 'sonardeck-release'
          $packageRoot = Join-Path $stageDir $zipRoot
          $zipPath = Join-Path $distDir "$zipRoot.zip"

          Remove-Item -Recurse -Force $stageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          git ls-files | ForEach-Object {
            $dest = Join-Path $packageRoot $_
            $destDir = Split-Path $dest -Parent
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item $_ $dest -Force
          }

          Copy-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'ui/dist') (Join-Path $packageRoot 'ui/dist')
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -Force
          Write-Host $zipPath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonarDeck-Studio-ZIP
          path: dist/SonarDeck-Studio-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SonarDeck-Studio-${{ github.ref_name }}.zip
          generate_release_notes: true
